plugins {
    id 'com.android.application'
}

def signingProperties = ["STORE_FILE", "STORE_PASSWORD", "KEY_ALIAS", "KEY_PASSWORD"].collectEntries { name ->
    [(name): providers.environmentVariable("WEEWA_SIGNING_${name}").orNull]
}
def hasReleaseSigning = signingProperties.values().every { it }

android {
    namespace = "com.xh.hotme"
    buildToolsVersion = rootProject.ext.buildToolsVersion

    lint {
        // Fail releases on APIs unavailable on our minimum supported Android.
        checkReleaseBuilds = true
        abortOnError = true
        checkDependencies = true
        checkOnly += ['NewApi', 'InlinedApi']
        fatal += ['NewApi', 'InlinedApi']
    }

    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.xh.hotme"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion  rootProject.ext.targetSdkVersion
        versionCode 129
        versionName "1.2.9"
        testInstrumentationRunner providers.gradleProperty("weewaTestRunner")
                .getOrElse("com.xh.hotme.account.MobileLoginSmsInstrumentation")
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }

    buildFeatures {
        buildConfig = true
    }
    signingConfigs {
        if (hasReleaseSigning) {
            weewaRelease {
                storeFile file(signingProperties.STORE_FILE)
                storePassword signingProperties.STORE_PASSWORD
                keyAlias signingProperties.KEY_ALIAS
                keyPassword signingProperties.KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.weewaRelease
            }
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            // JAR indexes are unused by Android's class loader.
            excludes += ['META-INF/INDEX.LIST']
            merges += ['META-INF/io.netty.versions.properties']
        }
    }

    viewBinding {
        enabled = true
    }

    flavorDimensions = ["brand", "role", "server"]
    productFlavors {
        rewoo {
            dimension "brand"
            applicationId "com.xh.hotme"
        }
        user {
            dimension "role"
            manifestPlaceholders.ROLE = "user"
        }
        crew {
            dimension "role"
            manifestPlaceholders.ROLE = "tester"
        }
        gztCrew {
            dimension "role"
            manifestPlaceholders.ROLE = "gztTestr"
        }
        service {
            dimension "role"
            manifestPlaceholders.ROLE = "service"
        }
        collector {
            dimension "role"
            manifestPlaceholders.ROLE = "collector"
        }
        greenKeeper {
            dimension "role"
            manifestPlaceholders.ROLE = "greenKeeper"
        }
        prod {
            dimension "server"
            manifestPlaceholders.TEST_SERVER = "false"
        }
        dev {
            dimension "server"
            manifestPlaceholders.TEST_SERVER = "true"
        }
    }

}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set(variant.name == "rewooGztCrewDevRelease"
                    ? "rewooAppV${output.versionName.get()}.apk"
                    : "hotme_${variant.name}_${output.versionName.get()}.apk")
        }
    }
}

