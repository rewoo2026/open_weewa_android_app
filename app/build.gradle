    implementation 'com.alibaba:fastjson:2.0.65'
    implementation 'org.greenrobot:eventbus:3.3.1'
    implementation 'com.umeng.umsdk:common:9.9.10'
    implementation 'com.umeng.umsdk:asms:1.8.7.2'
    implementation 'com.umeng.umsdk:apm:2.1.0'
    implementation 'com.umeng.umsdk:share-core:7.3.7'
    implementation 'com.umeng.umsdk:share-wx:7.3.7'
    implementation 'com.umeng.umsdk:share-board:7.3.7'
    implementation 'io.github.scwang90:refresh-layout-kernel:2.1.1'
    implementation 'io.github.scwang90:refresh-header-classics:2.1.1'
    implementation 'io.github.scwang90:refresh-footer-classics:2.1.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation('androidx.appcompat:appcompat:1.8.0', {
        exclude group: 'com.android.support', module: 'design'
    })
