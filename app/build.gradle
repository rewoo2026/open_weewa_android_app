    implementation("com.squareup.okhttp3:okhttp:5.5.0")
    implementation("com.squareup.okio:okio:3.18.2")
    implementation("com.fasterxml.jackson.core:jackson-annotations:2.22")
    implementation("com.fasterxml.jackson.core:jackson-core:2.22.3")
    implementation("com.fasterxml.jackson.core:jackson-databind:2.22.3")

    implementation 'cn.yipianfengye.android:zxing-library:2.2'

    implementation 'com.kyleduo.switchbutton:library:2.1.0'

    implementation project(':FlycoTabLayout_lib')
    implementation project(':weewa_lib')
    implementation project(':filedownloader')
    implementation project(':WheelPicker')
    implementation project(':calendarview')
    implementation project(':pickerview')

    //========================================================
    //浏览网页
    implementation 'com.github.Justson.AgentWeb:agentweb-core:5.1.7-androidx' // (必选)
    implementation 'com.github.Justson.AgentWeb:agentweb-filechooser:5.1.7-androidx'// (可选)

    // 摇杆
    implementation 'io.github.controlwear:virtualjoystick:1.10.1'

    // toast
    implementation 'io.github.muddz:styleabletoast:2.4.0'

    // rabbitmq
    implementation 'com.rabbitmq:amqp-client:5.37.0'
